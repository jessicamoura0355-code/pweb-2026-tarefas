{% extends 'app/base.html' %}

{% block content %}

<section class="posts">

    <h2>Últimas Postagens</h2>

    {% for post in posts %}

    <div class="card">

        <h3>{{ post.titulo }}</h3>

        <p class="data">{{ post.data_publi }}</p>

        <a href="{% url 'posts' post.id %}">
            Ler postagem →
        </a>

    </div>
    
    {% endfor %}

</section>

{% endblock %}
